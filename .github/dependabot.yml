---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the MariaDB LTS line; LTS upgrades are done deliberately.
      - dependency-name: mariadb
        update-types: ["version-update:semver-major"]
    groups:
      images-minor:
        update-types: [minor, patch]
