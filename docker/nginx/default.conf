# nginx sits behind Traefik (TLS) and Varnish (cache) and only speaks plain
# HTTP on the internal Docker network. This file is included in the `http {}`
# context of the stock nginx.conf.

# --- Real client IP -------------------------------------------------------
# Trust X-Forwarded-For only when it comes from private (Docker) networks.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Tell PHP the original request was HTTPS when Traefik says so.
map $http_x_forwarded_proto $forwarded_https {
    default off;
    https   on;
}

server_tokens off;
client_max_body_size 64m;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/rss+xml
    application/xml
    font/otf
    font/ttf
    image/svg+xml
    text/css
    text/plain
    text/xml;

server {
    listen 8080 default_server;
    server_name _;

    # Bedrock web root
    root /var/www/html/web;
    index index.php;

    # Container / Varnish probe endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        try_files $uri /index.php?$args;
        log_not_found off;
        access_log off;
    }

    # Hidden files (.env, .git, .htaccess...) except ACME/.well-known
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Never execute PHP from the uploads directory
    location ~* ^/app/uploads/.*\.php$ {
        deny all;
    }

    # XML-RPC is a common brute-force target; remove this block if you need it
    # (Jetpack, mobile apps).
    location = /wp/xmlrpc.php {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Static assets: long browser cache, cached by Varnish as well.
    location ~* \.(?:avif|css|eot|gif|ico|jpe?g|js|map|mjs|mp4|otf|png|svg|ttf|webm|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $forwarded_https;
        # httpoxy mitigation
        fastcgi_param HTTP_PROXY "";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }
}
