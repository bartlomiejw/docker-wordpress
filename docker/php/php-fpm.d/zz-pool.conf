; Overrides for the default [www] pool.
[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Expose the container environment (DB_*, WP_*, salts) to Bedrock.
clear_env = no

; Used by the container healthcheck (cgi-fcgi), not reachable through nginx.
ping.path = /ping
ping.response = pong

request_terminate_timeout = 130s
