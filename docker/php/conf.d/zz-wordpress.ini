; WordPress-oriented PHP settings. Values in ${...} come from the environment.

expose_php = Off
date.timezone = UTC
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = 120
max_input_vars = 3000

file_uploads = On
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
post_max_size = ${PHP_UPLOAD_MAX_FILESIZE}

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Outgoing mail goes through msmtp to an SMTP relay (Mailpit locally).
sendmail_path = "/usr/bin/msmtp -t --host=${SMTP_HOST} --port=${SMTP_PORT} --from=${MAIL_FROM} --auth=off --tls=off"
