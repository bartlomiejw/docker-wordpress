---
# WordPress (Bedrock) on Docker - local development stack.
#
#   Traefik (TLS) -> Varnish (cache) -> nginx -> PHP-FPM -> MariaDB / Redis
#
# Production: docker compose -f compose.yaml -f compose.prod.yaml up -d
# See README.md for details.

name: ${COMPOSE_PROJECT_NAME:-wordpress}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Environment shared by PHP-FPM and wp-cli. Bedrock reads it directly
# (PHP-FPM runs with clear_env = no), so there is no app/.env.
x-wordpress-env: &wordpress-env
  WP_ENV: ${WP_ENV:-development}
  WP_HOME: ${WP_HOME:-https://${DOMAIN:?set DOMAIN in .env}}
  WP_SITEURL: ${WP_HOME:-https://${DOMAIN}}/wp
  DB_HOST: db
  DB_NAME: ${DB_NAME:?set DB_NAME in .env}
  DB_USER: ${DB_USER:?set DB_USER in .env}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  AUTH_KEY: ${AUTH_KEY:?run make init}
  SECURE_AUTH_KEY: ${SECURE_AUTH_KEY:?run make init}
  LOGGED_IN_KEY: ${LOGGED_IN_KEY:?run make init}
  NONCE_KEY: ${NONCE_KEY:?run make init}
  AUTH_SALT: ${AUTH_SALT:?run make init}
  SECURE_AUTH_SALT: ${SECURE_AUTH_SALT:?run make init}
  LOGGED_IN_SALT: ${LOGGED_IN_SALT:?run make init}
  NONCE_SALT: ${NONCE_SALT:?run make init}
  WP_REDIS_HOST: redis
  WP_REDIS_PREFIX: "${COMPOSE_PROJECT_NAME:-wordpress}:"
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  MAIL_FROM: ${MAIL_FROM:-wordpress@example.test}
  PHP_OPCACHE_REVALIDATE_FREQ: "0"

x-php: &php
  build:
    context: ./docker/php
    args:
      HOST_UID: ${HOST_UID:-33}
      HOST_GID: ${HOST_GID:-33}
  image: ${COMPOSE_PROJECT_NAME:-wordpress}-php:local
  environment: *wordpress-env
  volumes:
    - ./app:/var/www/html
  networks:
    - app
  logging: *logging

services:
  # Read-only, filtered access to the Docker API for Traefik. Only container
  # listing/inspection is allowed; Traefik never sees the raw socket.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    restart: unless-stopped
    logging: *logging

  traefik:
    image: traefik:v3.7
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --ping=true
      - --api.dashboard=true
      - --entrypoints.web.address=:80
      # Redirect to the published HTTPS port (443 unless HTTPS_PORT is set).
      - --entrypoints.web.http.redirections.entrypoint.to=:${HTTPS_PORT:-443}
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Drop headers like X_Forwarded_For that PHP/nginx would read as X-Forwarded-For.
      - --entrypoints.web.http.aliasheadersstrategy=delete
      - --entrypoints.websecure.http.aliasheadersstrategy=delete
      - --entrypoints.traefik.address=:8080
      - --entrypoints.traefik.http.aliasheadersstrategy=delete
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${COMPOSE_PROJECT_NAME:-wordpress}_edge
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME:-wordpress}`)
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    environment:
      TRAEFIK_LOCAL_CERT: "true"
      TRAEFIK_BASIC_AUTH_USERS: ${TRAEFIK_BASIC_AUTH_USERS:?run make init}
    ports:
      # Bound to loopback by default: the local stack is not reachable from
      # the LAN. Set BIND_ADDRESS=0.0.0.0 to share it.
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    depends_on:
      - socket-proxy
    networks:
      - edge
      - socket
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: admin-auth@file,security-headers@file
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging

  varnish:
    image: varnish:9.0
    environment:
      VARNISH_SIZE: ${VARNISH_SIZE:-256M}
    volumes:
      - ./docker/varnish:/etc/varnish:ro
    tmpfs:
      - /var/lib/varnish/varnishd:exec
    depends_on:
      nginx:
        condition: service_healthy
        # Varnish resolves the backend once at VCL load; restart it whenever
        # nginx is recreated so it does not keep a stale container IP.
        restart: true
    networks:
      - edge
      - app
    labels:
      traefik.enable: "true"
      # PURGE/BAN are internal-only: refused at the edge, and by the VCL ACL.
      traefik.http.routers.wordpress.rule: Host(`${DOMAIN}`) && !Method(`PURGE`) && !Method(`BAN`)
      traefik.http.routers.wordpress.entrypoints: websecure
      traefik.http.routers.wordpress.middlewares: security-headers@file
      traefik.http.services.wordpress.loadbalancer.server.port: "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/varnish-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:1.30-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app:/var/www/html:ro
    depends_on:
      php:
        condition: service_healthy
        restart: true
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  php:
    <<: *php
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # One-off containers: `make wp ARGS="..."` and `make composer ARGS="..."`.
  wp-cli:
    <<: *php
    profiles: ["cli"]
    entrypoint: ["wp"]
    user: www-data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  composer:
    image: composer:2.10
    profiles: ["cli"]
    user: "${HOST_UID:-33}:${HOST_GID:-33}"
    environment:
      COMPOSER_HOME: /tmp/composer
    working_dir: /app
    volumes:
      - ./app:/app
      - ./docker/bedrock:/stack:ro
    networks:
      - app
    logging: *logging

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8.6-alpine
    # Pure cache: bounded memory, LRU eviction, no persistence.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  mailpit:
    image: axllent/mailpit:v1.32
    environment:
      MP_MAX_MESSAGES: 500
    networks:
      - edge
      - app
    labels:
      traefik.enable: "true"
      traefik.http.routers.mailpit.rule: Host(`mail.${DOMAIN}`)
      traefik.http.routers.mailpit.entrypoints: websecure
      traefik.http.routers.mailpit.middlewares: security-headers@file
      traefik.http.services.mailpit.loadbalancer.server.port: "8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # Optional: COMPOSE_PROFILES=tools (or `make up PROFILES=tools`).
  phpmyadmin:
    image: phpmyadmin:5.2
    profiles: ["tools"]
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: https://pma.${DOMAIN}/
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - app
    labels:
      traefik.enable: "true"
      traefik.http.routers.pma.rule: Host(`pma.${DOMAIN}`)
      traefik.http.routers.pma.entrypoints: websecure
      traefik.http.routers.pma.middlewares: security-headers@file
      traefik.http.services.pma.loadbalancer.server.port: "80"
    restart: unless-stopped
    logging: *logging

networks:
  # Traefik <-> public-facing containers
  edge:
    name: ${COMPOSE_PROJECT_NAME:-wordpress}_edge
  # Application tier (Varnish, nginx, PHP, MariaDB, Redis, Mailpit)
  app:
  # Traefik <-> socket proxy only, no outbound access
  socket:
    internal: true

volumes:
  db-data:
